[package]
name = "fresnel-core"
description = "Hardware abstraction, normalised Wi-Fi models, scanning and storage for Fresnel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
image.workspace = true
kamadak-exif.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# The NetworkManager (D-Bus) and nl80211 (netlink) adapters. netlink-sys, via
# wl-nl80211, doesn't compile on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
wl-nl80211.workspace = true
# Active tests: ping sockets, SO_BINDTODEVICE, TCP_INFO.
socket2.workspace = true
libc.workspace = true

# Windows APIs (Windows only, so Linux builds don't pull in Windows import
# libraries): Native Wifi for the provider; ICMP echo (IcmpSendEcho2Ex /
# Icmp6SendEcho2), interface addresses and the best route (IP Helper) for
# active tests.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_Networking_WinSock",
  "Win32_System_IO",
] }

[dev-dependencies]
# test-util: paused virtual time, so timeout tests don't wait in real time.
tokio = { workspace = true, features = ["test-util", "process"] }
tracing-subscriber.workspace = true
