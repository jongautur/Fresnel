name: Feature request
description: Something Fresnel should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/jongautur/Fresnel/blob/main/ROADMAP.md) first; it may be
        planned already. Open questions and early ideas fit better in
        [Discussions](https://github.com/jongautur/Fresnel/discussions).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mention other tools that do it well, if any.
  - type: dropdown
    id: help
    attributes:
      label: Would you help?
      options:
        - I'd test it
        - I'd like to build it
        - Just the idea
